<script>
(() => {
  const CATEGORIES=['All','Politics','Health','Finance','Other'];
  const STATUSES=['All','Unverified','Verified True','False','Misleading'];
  const PLATFORMS=['WhatsApp','X','Instagram','Other'];
  const STORAGE_KEY='signalcheck.claims.static.v1';
  const seeds=[
    {id:'seed-1',text:'Earth takes about 365.25 days to complete one trip around the Sun.',platform:'X',category:'Other',flags:[],riskLevel:'Normal',status:'Verified True',reviewerNote:'Demo review checked against NASA Earth facts. NASA states that Earth takes 365.25 days to complete one trip around the Sun.',sourceUrl:'https://science.nasa.gov/earth/facts/',submittedAt:'2026-09-18T17:20:00.000Z',reviewedAt:'2026-09-18T18:05:00.000Z'},
    {id:'seed-2',text:'Every year, vaccines save millions of lives and protect people from vaccine-preventable diseases.',platform:'WhatsApp',category:'Health',flags:[],riskLevel:'Normal',status:'Verified True',reviewerNote:'Demo review checked against WHO immunization information. WHO says vaccines save millions of lives every year.',sourceUrl:'https://www.who.int/europe/health-topics/vaccines-and-immunization/supporting-vaccine-safety',submittedAt:'2026-09-18T18:15:00.000Z',reviewedAt:'2026-09-18T19:00:00.000Z'},
    {id:'seed-3',text:'BREAKING!!! SHOCKING!!! SHARE BEFORE DELETED!!! This miracle treatment works instantly.',platform:'Instagram',category:'Health',flags:['Sensational','Shouting','Unsourced'],riskLevel:'High',status:'Unverified',reviewerNote:'',sourceUrl:'',submittedAt:'2026-09-18T20:40:00.000Z',reviewedAt:null},
    {id:'seed-4',text:'Diversification guarantees that your investments cannot lose money when markets fall.',platform:'X',category:'Finance',flags:['Unsourced'],riskLevel:'Normal',status:'Misleading',reviewerNote:'Demo review checked against Investor.gov. Diversification can reduce risk, but it does not guarantee that an investor will not lose money.',sourceUrl:'https://www.investor.gov/introduction-investing/investing-basics/save-and-invest/diversify-your-investments',submittedAt:'2026-09-18T21:10:00.000Z',reviewedAt:'2026-09-18T21:45:00.000Z'},
    {id:'seed-5',text:'The annual percentage rate (APR) is a standard way to compare how much loan products cost.',platform:'Other',category:'Finance',flags:[],riskLevel:'Normal',status:'Verified True',reviewerNote:'Demo review checked against the CFPB consumer guide. CFPB defines APR as a standard way to compare loan costs.',sourceUrl:'https://www.consumerfinance.gov/consumer-tools/credit-cards/answers/key-terms/',submittedAt:'2026-09-18T22:15:00.000Z',reviewedAt:'2026-09-18T22:40:00.000Z'},
    {id:'seed-6',text:'The U.S. Supreme Court is made up of one Chief Justice and eight Associate Justices.',platform:'X',category:'Politics',flags:[],riskLevel:'Normal',status:'Verified True',reviewerNote:'Demo review checked against the Supreme Court’s official Justice roster, which states that nine Justices make up the current Court.',sourceUrl:'https://www.supremecourt.gov/about/justices.aspx',submittedAt:'2026-09-18T23:05:00.000Z',reviewedAt:'2026-09-18T23:25:00.000Z'},
    {id:'seed-7',text:'The city library added Sunday hours. Check the library notice before sharing.',platform:'Other',category:'Other',flags:['Unsourced'],riskLevel:'Normal',status:'Unverified',reviewerNote:'',sourceUrl:'',submittedAt:'2026-09-19T00:05:00.000Z',reviewedAt:null}
  ];
  const icon=(name,size=15)=>{
    const s=String(size);
    const common=`width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;
    const paths={
      shield:`<path ${common} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path ${common} d="m9 12 2 2 4-4"/>`,
      plus:`<path ${common} d="M12 5v14M5 12h14"/>`,
      file:`<path ${common} d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path ${common} d="M14 2v6h6M8 13h8M8 17h6"/>`,
      info:`<circle ${common} cx="12" cy="12" r="10"/><path ${common} d="M12 16v-4M12 8h.01"/>`,
      alert:`<path ${common} d="M10.3 3.2 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z"/><path ${common} d="M12 9v4M12 17h.01"/>`,
      check:`<circle ${common} cx="12" cy="12" r="10"/><path ${common} d="m8 12 2.5 2.5L16 9"/>`,
      xcircle:`<circle ${common} cx="12" cy="12" r="10"/><path ${common} d="m15 9-6 6M9 9l6 6"/>`,
      clock:`<circle ${common} cx="12" cy="12" r="10"/><path ${common} d="M12 6v6l4 2"/>`,
      external:`<path ${common} d="M14 3h7v7"/><path ${common} d="M10 14 21 3"/><path ${common} d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>`,
      filter:`<path ${common} d="M4 6h16M7 12h10M10 18h4"/>`,
      chevron:`<path ${common} d="m6 9 6 6 6-6"/>`,
      refresh:`<path ${common} d="M20 11a8.1 8.1 0 0 0-14.5-3.9L3 10"/><path ${common} d="M3 5v5h5"/><path ${common} d="M4 13a8.1 8.1 0 0 0 14.5 3.9L21 14"/><path ${common} d="M21 19v-5h-5"/>`,
      trash:`<path ${common} d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>`,
      arrow:`<path ${common} d="m15 18-6-6 6-6"/>`,
      menu:`<path ${common} d="M4 6h16M4 12h16M4 18h16"/>`,
      close:`<path ${common} d="m6 6 12 12M18 6 6 18"/>`
    };
    return `<svg ${common}>${paths[name]||''}</svg>`;
  };
  const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const formatDate=v=>new Date(v).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
  const cloneSeeds=()=>seeds.map(c=>({...c,flags:[...(c.flags||[])]}));
  const readClaims=()=>{try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return cloneSeeds();const p=JSON.parse(raw);return Array.isArray(p)?p:cloneSeeds()}catch{return cloneSeeds()}};
  const saveClaims=claims=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(claims));};
  const getClaims=()=>readClaims().sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  const getClaim=id=>getClaims().find(c=>String(c.id)===String(id))||null;
  const detectUrl=text=>(text.match(/(?:https?:\/\/|www\.)\S+/i)||[])[0]||'';
  function analyzeClaim(text){
    const normalized=text.toLowerCase(); const flags=[];

    const letters=[...text].filter(ch=>/[A-Za-z]/.test(ch));
    const uppercase=letters.reduce((n,ch)=>n+Number(ch===ch.toUpperCase()),0);
    if(letters.length && uppercase/letters.length>0.5)flags.push('Shouting');
    if(!/(?:https?:\/\/|www\.)\S+/i.test(text))flags.push('Unsourced');
    return {flags,riskLevel:flags.length>=2?'High':'Normal'};
  }
  const createClaim=data=>{
    const text=String(data.text||'').trim(); if(!text)throw new Error('Claim text is required.');
    const {flags,riskLevel}=analyzeClaim(text); const claim={id:globalThis.crypto?.randomUUID?.()||`claim-${Date.now()}`,text,platform:data.platform,category:data.category,flags,riskLevel,status:'Unverified',reviewerNote:'',sourceUrl:detectUrl(text),submittedAt:new Date().toISOString(),reviewedAt:null};
    saveClaims([claim,...readClaims()]);return claim;
  };
  const reviewClaim=(id,data)=>{const claims=readClaims();const i=claims.findIndex(c=>String(c.id)===String(id));if(i<0)throw new Error('Claim not found.');const updated={...claims[i],status:data.status,reviewerNote:String(data.reviewerNote||'').trim(),reviewedAt:new Date().toISOString()};claims[i]=updated;saveClaims(claims);return updated;};
  const deleteReview=id=>{const claims=readClaims();const i=claims.findIndex(c=>String(c.id)===String(id));if(i<0)throw new Error('Claim not found.');claims[i]={...claims[i],status:'Unverified',reviewerNote:'',reviewedAt:null};saveClaims(claims);return claims[i];};
  const deleteClaim=id=>{const claims=readClaims();const next=claims.filter(c=>String(c.id)!==String(id));if(next.length===claims.length)throw new Error('Claim not found.');saveClaims(next);};
  const resetDemo=()=>saveClaims(cloneSeeds());
  const route=()=>{const raw=location.hash.replace(/^#/,'')||'/';const [path,qs]=raw.split('?');const q=new URLSearchParams(qs||'');if(path==='/submit')return{page:'submit'};if(path==='/review')return{page:'review'};const m=path.match(/^\/claims\/([^/]+)$/);if(m)return{page:'detail',id:decodeURIComponent(m[1]),fromReview:q.get('review')==='1'};return{page:'feed'};};
  const go=p=>{const target=p.startsWith('#')?p:`#${p}`;if(location.hash===target)render();else location.hash=target;};
  let menuOpen=false; let currentCategory='All'; let currentStatus='All';
  const app=document.getElementById('app');
  const iconBadge=(text,tone,iconName)=>`<span class="badge ${tone}">${icon(iconName,12)}${esc(text)}</span>`;
  const statusBadge=s=>s==='Verified True'?iconBadge(s,'true','check'):s==='False'?iconBadge(s,'false','xcircle'):s==='Misleading'?iconBadge(s,'misleading','alert'):iconBadge(s,'unverified','info');
  const riskBadge=l=>l==='High'?iconBadge('High Risk','high','alert'):iconBadge('Normal Risk','normal','shield');
  function layout(content){
    return `<div class="app-shell"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
      <header class="topbar"><button class="brand" data-route="/" aria-label="Go to feed"><span class="brand-mark">${icon('shield',18)}</span><span>SignalCheck</span></button><button class="mobile-menu" data-menu aria-label="Toggle navigation">${icon(menuOpen?'close':'menu',20)}</button>
      <nav class="${menuOpen?'open':''}"><button class="nav-link" data-route="/">Feed</button><button class="nav-link" data-route="/review">Review</button><button class="primary nav-cta" data-route="/submit">${icon('plus',15)} Submit a Claim</button></nav></header>
      <main>${content}</main><footer class="footer"><span>SignalCheck</span><span>Transparent triage · Human review · Local browser storage</span></footer><div id="toast" class="toast"></div></div>`;
  }
  function claimCard(c){
    return `<article class="claim-card" data-claim-id="${esc(c.id)}" tabindex="0"><div class="card-top">${riskBadge(c.riskLevel)}${statusBadge(c.status)}</div><p class="claim-text">${esc(c.text)}</p>${c.sourceUrl?`<a class="source-link" href="${esc(c.sourceUrl)}" target="_blank" rel="noreferrer" data-stop>${icon('external',13)} Source</a>`:''}<div class="meta"><span>${esc(c.platform)}</span><span>·</span><span>${esc(c.category)}</span><span>·</span><span>${icon('clock',13)}${esc(formatDate(c.submittedAt))}</span></div>${c.flags?.length?`<div class="flag-row">${c.flags.map(f=>`<span class="flag">${icon('alert',12)}${esc(f)}</span>`).join('')}</div>`:''}</article>`;
  }
  function feedPage(){
    const claims=getClaims(); const filtered=claims.filter(c=>(currentCategory==='All'||c.category===currentCategory)&&(currentStatus==='All'||c.status===currentStatus));
    return `<section class="page"><div class="hero"><div class="hero-copy"><div class="eyebrow">${icon('file',15)} Civic tech · Claim triage</div><h1>Check what needs attention <span>before it spreads.</span></h1><p>SignalCheck flags information-risk signals and gives reviewers a simple evidence workflow. It checks information, not ideologies.</p><div class="hero-actions"><button class="primary" data-route="/submit">${icon('plus',16)} Submit a claim</button><button class="secondary ghost" data-route="/review">${icon('shield',16)} Open review queue</button></div></div><div class="hero-note">${icon('info',16)}<span>Risk level describes post characteristics, not whether a claim is true or false.</span></div></div>
      <div class="filters"><div class="filter-group"><span>Category</span><div class="segmented">${CATEGORIES.map(x=>`<button class="${currentCategory===x?'active':''}" data-category="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><label class="select-wrap">${icon('filter',15)}<select id="status-filter">${STATUSES.map(x=>`<option ${currentStatus===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${icon('chevron',15)}</label></div>
      <div class="feed-head"><div><div class="eyebrow small">${icon('refresh',12)} Live browser record</div><h2>Public feed</h2></div><span>${filtered.length} claims</span></div>
      ${filtered.length?`<div class="feed-grid">${filtered.map(claimCard).join('')}</div>`:`<div class="empty">No claims match these filters.</div>`}</section>`;
  }
  function submitPage(){
    return `<section class="page narrow"><button class="back" data-route="/">${icon('arrow',16)} Back to Feed</button><div class="section-heading"><div class="eyebrow">New claim</div><h1>Submit a viral claim</h1><p>Paste the post text and give us its source context. Risk flags are generated automatically.</p></div><form class="panel form" id="submit-form"><label>Claim text<textarea id="claim-text" required rows="8" placeholder="Paste the viral post here…"></textarea></label><div class="two-col"><label>Source platform<select id="platform">${PLATFORMS.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Category<select id="category">${CATEGORIES.filter(x=>x!=='All').map(x=>`<option>${x}</option>`).join('')}</select></label></div><div id="submit-error"></div><div class="form-actions"><span>New claims begin as <strong>Unverified</strong>.</span><button class="primary" type="submit">${icon('file',15)} Analyze & Submit</button></div></form></section>`;
  }
  function detailPage(id,fromReview){
    const c=getClaim(id); if(!c)return `<section class="page narrow"><button class="back" data-route="/">${icon('arrow',16)} Back to Feed</button><div class="empty">This claim no longer exists.</div></section>`;
    return `<section class="page narrow"><button class="back" data-route="${fromReview?'/review':'/'}">${icon('arrow',16)} Back</button><div class="detail-top"><div><div class="badge-row">${riskBadge(c.riskLevel)}${statusBadge(c.status)}</div><div class="meta big">${esc(c.category)} · ${esc(c.platform)} · Submitted ${esc(formatDate(c.submittedAt))}</div></div></div>
      <div class="detail-layout"><div class="panel claim-detail"><div class="panel-title">Claim</div><p class="detail-text">${esc(c.text)}</p>${c.sourceUrl?`<a class="source-link large" href="${esc(c.sourceUrl)}" target="_blank" rel="noreferrer">${icon('external',14)} Verify source</a>`:''}</div><div class="panel"><div class="panel-title">Risk flags</div>${c.flags?.length?`<div class="flag-list">${c.flags.map(f=>`<div class="flag-item">${icon('alert',15)}<span>${esc(f)}</span></div>`).join('')}</div>`:`<div class="clean">${icon('check',17)}No automatic risk flags</div>`}</div></div>
      ${c.reviewerNote?`<div class="panel evidence-card"><div class="panel-title">Reviewer evidence note</div><p>${esc(c.reviewerNote)}</p>${c.reviewedAt?`<div class="meta">Reviewed ${esc(formatDate(c.reviewedAt))}</div>`:''}</div>`:''}
      <div class="panel review-panel"><div class="panel-title">Review</div><div class="two-col"><label>Status<select id="review-status">${STATUSES.filter(x=>x!=='All').map(x=>`<option ${c.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><div class="review-hint">${icon('info',14)} Reviewer decisions are saved in this browser.</div></div><label>Reviewer note<textarea id="review-note" rows="4" placeholder="Add a short evidence note…">${esc(c.reviewerNote||'')}</textarea></label><div id="review-error"></div><div class="form-actions"><span>${c.reviewedAt?`Last reviewed ${esc(formatDate(c.reviewedAt))}`:'Not reviewed yet'}</span><div class="action-row"><button class="secondary danger" data-delete-review="${esc(c.id)}" ${!c.reviewedAt?'disabled':''}>${icon('trash',15)} Delete Review</button><button class="secondary danger-soft" data-delete-claim="${esc(c.id)}">${icon('trash',15)} Delete Claim</button><button class="primary" data-save-review="${esc(c.id)}">${icon('check',15)} Save Review</button></div></div></div></section>`;
  }
  function reviewPage(){
    const waiting=getClaims().filter(c=>c.status==='Unverified');
    return `<section class="page"><div class="section-heading"><div class="eyebrow">Reviewer workspace</div><h1>Claims awaiting review</h1><p>Move a claim from Unverified to a reviewed status and add a short evidence note.</p></div><div class="review-toolbar"><span class="meta">${icon('shield',14)} Local demo workspace</span><button class="secondary" data-reset>${icon('refresh',15)} Restore demo data</button></div>${waiting.length?`<div class="review-list">${waiting.map(c=>`<article class="review-card"><div><div class="card-top">${riskBadge(c.riskLevel)}<span class="meta">${esc(c.category)} · ${esc(c.platform)}</span></div><p class="claim-text">${esc(c.text)}</p></div><button class="secondary" data-route="/claims/${encodeURIComponent(c.id)}?review=1">Review Claim ${icon('arrow',14)}</button></article>`).join('')}</div>`:`<div class="empty">Nothing is waiting for review.</div>`}</section>`;
  }
  function render(){menuOpen=false;const r=route();let content=r.page==='submit'?submitPage():r.page==='review'?reviewPage():r.page==='detail'?detailPage(r.id,r.fromReview):feedPage();app.innerHTML=layout(content);window.scrollTo({top:0,behavior:'smooth'});bind();}
  function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
  function bind(){
    document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.route)}));
    const menu=document.querySelector('[data-menu]'); if(menu)menu.addEventListener('click',()=>{menuOpen=!menuOpen;const nav=document.querySelector('.topbar nav');nav.classList.toggle('open',menuOpen);menu.innerHTML=icon(menuOpen?'close':'menu',20)});
    document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('click',()=>{currentCategory=el.dataset.category;render()}));
    const sf=document.getElementById('status-filter'); if(sf)sf.addEventListener('change',()=>{currentStatus=sf.value;render()});
    document.querySelectorAll('[data-claim-id]').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('[data-stop]'))return;go('/claims/'+encodeURIComponent(el.dataset.claimId))});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('/claims/'+encodeURIComponent(el.dataset.claimId))}})});
    const form=document.getElementById('submit-form'); if(form)form.addEventListener('submit',e=>{e.preventDefault();const err=document.getElementById('submit-error');err.innerHTML='';try{const claim=createClaim({text:document.getElementById('claim-text').value,platform:document.getElementById('platform').value,category:document.getElementById('category').value});toast('Claim submitted and analyzed');go('/claims/'+encodeURIComponent(claim.id));}catch(x){err.innerHTML=`<div class="error">${esc(x.message)}</div>`}});
    document.querySelectorAll('[data-save-review]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.saveReview;try{reviewClaim(id,{status:document.getElementById('review-status').value,reviewerNote:document.getElementById('review-note').value});toast('Review saved');render()}catch(x){document.getElementById('review-error').innerHTML=`<div class="error">${esc(x.message)}</div>`}}));
    document.querySelectorAll('[data-delete-review]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;if(!confirm('Delete this review and return the claim to Unverified?'))return;try{deleteReview(b.dataset.deleteReview);toast('Review deleted');render()}catch(x){document.getElementById('review-error').innerHTML=`<div class="error">${esc(x.message)}</div>`}}));
    document.querySelectorAll('[data-delete-claim]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('Delete this saved claim permanently? This cannot be undone.'))return;try{deleteClaim(b.dataset.deleteClaim);toast('Claim deleted');go('/')}catch(x){document.getElementById('review-error').innerHTML=`<div class="error">${esc(x.message)}</div>`}}));
    const reset=document.querySelector('[data-reset]'); if(reset)reset.addEventListener('click',()=>{if(confirm('Restore the original demo claims?')){resetDemo();toast('Demo data restored');render()}});
  }
  window.addEventListener('hashchange',render);
  window.addEventListener('storage',render);
  if(!localStorage.getItem(STORAGE_KEY))saveClaims(cloneSeeds());
  render();
})();
</script>
</body>
</html>
